[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:slowapi
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html

[coverage:run]
omit =
    app/tasks/*
    app/websocket/*
    app/database.py
    app/main.py
    app/dependencies.py
