name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Start test environment
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install --with-deps

      - name: Run auth setup
        run: |
          cd e2e
          npx playwright test auth.setup.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          ADMIN_EMAIL: admin@assistenciaimpacto.com.br
          ADMIN_SENHA: Admin@123
          TECNICO_EMAIL: tecnico@assistenciaimpacto.com.br
          TECNICO_SENHA: Tecnico@123
          CI: true

      - name: Run E2E tests - Financeiro
        run: |
          cd e2e
          npx playwright test financeiro.spec.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          ADMIN_EMAIL: admin@assistenciaimpacto.com.br
          ADMIN_SENHA: Admin@123
          CI: true

      - name: Run E2E tests - Agenda
        run: |
          cd e2e
          npx playwright test agenda.spec.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          ADMIN_EMAIL: admin@assistenciaimpacto.com.br
          ADMIN_SENHA: Admin@123
          CI: true

      - name: Run E2E tests - Equipe
        run: |
          cd e2e
          npx playwright test equipe.spec.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          ADMIN_EMAIL: admin@assistenciaimpacto.com.br
          ADMIN_SENHA: Admin@123
          CI: true

      - name: Run E2E tests - Notificações
        run: |
          cd e2e
          npx playwright test notificacoes.spec.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          ADMIN_EMAIL: admin@assistenciaimpacto.com.br
          ADMIN_SENHA: Admin@123
          CI: true

      - name: Run E2E tests - Portal
        run: |
          cd e2e
          npx playwright test portal.spec.ts
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000/api
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: e2e/reports/html/
          retention-days: 7

      - name: Stop test environment
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v
