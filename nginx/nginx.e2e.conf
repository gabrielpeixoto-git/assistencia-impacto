server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Arquivos estáticos do frontend (React build)
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API proxy → backend
    location /api/ {
        proxy_pass http://backend_e2e:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy → backend
    location /ws/ {
        proxy_pass http://backend_e2e:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA routing — todas as rotas não-API vão para index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets com cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
